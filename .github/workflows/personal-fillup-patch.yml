name: Patch plein perso (cloud)

# One-shot : plein 206 Intermarché La Guerche + trajet du 12/09 si absent.
# Écrit via login + GET/PUT /api/sync (routes déjà live). Idempotent.
# Ne rebuild PAS l’APK.

on:
  push:
    branches: [prod, cursor/cloud-fillup-sync-37e1]
    paths:
      - 'scripts/ci/personal-fillup-once.json'
      - 'scripts/ci/apply-personal-fillup-sync.mjs'
      - '.github/workflows/personal-fillup-patch.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enregistrer le plein sur le sync cloud
        env:
          API_URL: https://gasoil-tracking.delhomme.ovh
          PERSONAL_MAIL: ${{ secrets.PERSONAL_MAIL }}
          PERSONAL_PASSWORD: ${{ secrets.PERSONAL_PASSWORD }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
        run: node scripts/ci/apply-personal-fillup-sync.mjs
