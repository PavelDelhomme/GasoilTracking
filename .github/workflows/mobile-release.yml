name: Mobile APK release

# Build APK (EAS) + upload auto vers l'API prod à chaque push sur prod
# Secrets GitHub requis : EXPO_TOKEN, RELEASE_UPLOAD_TOKEN

on:
  push:
    branches: [prod]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'context/**'
      - 'hooks/**'
      - 'constants/**'
      - 'app.json'
      - 'package.json'
      - 'eas.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version APK (ex: 1.0.1)'
        required: false
        default: ''

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V=$(node -p "require('./app.json').expo.version")
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build Android APK (EAS cloud)
        id: build
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > /tmp/eas-build.json
          cat /tmp/eas-build.json
          URL=$(node -e "const j=require('/tmp/eas-build.json'); const a=Array.isArray(j)?j[0]:j; console.log(a.artifacts?.buildUrl || a.artifact?.url || a.url || '')")
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then echo "Pas d'URL APK"; exit 1; fi

      - name: Download APK
        run: curl -fsSL -o /tmp/gasoil.apk "${{ steps.build.outputs.apk_url }}"

      - name: Upload to Gasoil API (prod)
        env:
          TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          curl -fsS -X POST "https://gasoil-tracking.delhomme.ovh/api/ci/releases" \
            -H "X-Release-Token: $TOKEN" \
            -F "version=$VERSION" \
            -F "releaseNotes=Build automatique GitHub Actions ($GITHUB_SHA)" \
            -F "apk=@/tmp/gasoil.apk"
          echo "APK $VERSION publié"
