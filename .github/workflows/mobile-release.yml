name: Mobile APK release

# Build APK sur le runner GitHub (eas --local) + upload API prod à chaque push sur prod.
# --local : ne consomme PAS le quota EAS cloud (Free plan saturé jusqu’au 1er du mois).
# Secrets GitHub requis : EXPO_TOKEN, RELEASE_UPLOAD_TOKEN

on:
  push:
    branches: [prod]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'context/**'
      - 'hooks/**'
      - 'constants/**'
      - 'plugins/**'
      - 'app.json'
      - 'package.json'
      - 'eas.json'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version APK (ex: 1.4.53)'
        required: false
        default: ''

concurrency:
  group: mobile-apk-prod
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V=$(node -p "require('./app.json').expo.version")
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Announce build pending (API)
        env:
          TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          curl -fsS -X POST "https://gasoil-tracking.delhomme.ovh/api/ci/releases/pending" \
            -H "X-Release-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"$VERSION\",\"releaseNotes\":\"Mise à jour en préparation\",\"sha\":\"$GITHUB_SHA\"}" \
            || echo "Annonce pending échouée — on continue"

      - name: Build Android APK (EAS local, sans quota cloud)
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          # eas --local n’exporte pas toujours EAS_BUILD au prebuild/gradle
          EAS_BUILD: 'true'
          CI: 'true'
        run: |
          eas build --platform android --profile production \
            --non-interactive --local --output /tmp/gasoil.apk
          ls -lh /tmp/gasoil.apk
          test -s /tmp/gasoil.apk || { echo "Pas d'APK produit"; exit 1; }

      - name: Upload to Gasoil API (prod)
        env:
          TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          curl -fsS -X POST "https://gasoil-tracking.delhomme.ovh/api/ci/releases" \
            -H "X-Release-Token: $TOKEN" \
            -F "version=$VERSION" \
            -F "forceUpdate=1" \
            -F "releaseNotes=Améliorations trajets, navigation et stabilité — version $VERSION." \
            -F "apk=@/tmp/gasoil.apk"
          echo "APK $VERSION publié"
          curl -sf "https://gasoil-tracking.delhomme.ovh/api/version" || true
          echo
