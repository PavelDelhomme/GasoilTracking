# Gasoil Tracking — déploiement local / Portainer
# Domaine cible : https://gasoil-tracking.delhomme.ovh
# Portainer : https://portainer.delhomme.ovh
# Nginx Proxy Manager : https://nginx.delhomme.ovh

services:
  web:
    image: gasoil-tracking-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasoil-tracking-web
    labels:
      - "com.gasoiltracking.project=gasoil-tracking"
      - "com.gasoiltracking.service=web"
    restart: unless-stopped
    ports:
      # Port hôte local (évite collisions avec StreamMake / Cloudity)
      - "${GASOIL_HOST_PORT:-3340}:80"
    networks:
      - gasoil-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  gasoil-network:
    name: gasoil-network
    driver: bridge
