<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gasoil Tracking — Télécharger</title>
  <style>
    :root { --bg:#0f0f1a; --card:#1a1a2e; --accent:#e94560; --text:#f1f5f9; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:linear-gradient(160deg,#0f0f1a,#16213e 50%,#0f0f1a); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .box { max-width:420px; width:100%; background:var(--card); border:1px solid #2d2d44; border-radius:20px; padding:32px; }
    h1 { margin:0 0 8px; font-size:1.6rem; }
    p { color:var(--muted); line-height:1.5; }
    .btn { display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none; padding:14px 18px; border-radius:12px; font-weight:700; margin-top:16px; }
    .btn.secondary { background:transparent; border:1px solid #2d2d44; color:var(--text); font-weight:600; }
    .btn[aria-disabled="true"] { opacity:.45; pointer-events:none; }
    .meta { margin-top:16px; font-size:.9rem; color:var(--muted); }
    .ver { margin-top:12px; font-size:1.05rem; font-weight:700; color:#fff; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Gasoil Tracking</h1>
    <p>Application Android (APK). Installez la dernière version publiée, ou utilisez la version web.</p>
    <p class="ver" id="ver">Chargement…</p>
    <a class="btn" id="dl" href="#" aria-disabled="true">Télécharger l’APK</a>
    <a class="btn secondary" href="/">Ouvrir la version web</a>
    <p class="meta" id="info"></p>
  </div>
  <script>
    fetch('/api/version')
      .then(function (r) { return r.json(); })
      .then(function (v) {
        var ver = document.getElementById('ver');
        var dl = document.getElementById('dl');
        var info = document.getElementById('info');
        ver.textContent = 'Version ' + (v.version || '—');
        if (v.apkUrl) {
          dl.href = v.apkUrl;
          dl.removeAttribute('aria-disabled');
          dl.textContent = 'Télécharger APK ' + v.version;
          dl.setAttribute('download', 'gasoil-tracking-' + v.version + '.apk');
        } else {
          dl.textContent = 'APK indisponible';
        }
        info.textContent = v.releaseNotes || '';
      })
      .catch(function () {
        document.getElementById('ver').textContent = 'API indisponible';
        document.getElementById('info').textContent = 'Réessayez dans un instant.';
      });
  </script>
</body>
</html>
